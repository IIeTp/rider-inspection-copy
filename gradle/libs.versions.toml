[versions]
kotlin = "2.4.10" # Current stable Kotlin release; compatible with Rider 2026.2 model jars
rdGen = "2026.2.5" # https://github.com/JetBrains/rd/releases
detekt = "2.0.0-alpha.6" # Built against Kotlin 2.4.10, Gradle 9.6.1, and JDK 25
junit4 = "4.13.2"

[libraries]
kotlinStdLib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
rdGen = { group = "com.jetbrains.rd", name = "rd-gen", version.ref = "rdGen" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
