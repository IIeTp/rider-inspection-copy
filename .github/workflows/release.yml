name: Build and release plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.8.0'
        required: true
        default: 'v0.8.0'

# Never cancel a build just because another commit was pushed.
# Every push/PR event must produce a separately observable run.
concurrency:
  group: plugin-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build plugin
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Verify checked out revision
        shell: bash
        run: |
          echo "GitHub SHA: $GITHUB_SHA"
          echo "Checked out SHA: $(git rev-parse HEAD)"
          git log -1 --oneline --decorate
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          echo "Revision verification: OK"

      - name: Verify Rider test configuration
        shell: bash
        run: |
          grep -F 'testFramework(TestFrameworkType.Bundled)' build.gradle.kts
          if grep -Fq 'TestFrameworkType.Platform.Bundled' build.gradle.kts; then
            echo 'Invalid Rider test framework configuration detected.' >&2
            exit 1
          fi
          test -f src/rider/ideTest/kotlin/com/codex/rider/inspectioncopy/RiderPluginIntegrationTest.kt
          echo 'Rider test configuration: OK'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(sed -n 's/^PluginVersion=//p' gradle.properties | head -n 1)"
          fi

          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: $version" >&2
            exit 1
          fi

          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release package
        shell: bash
        run: |
          rm -rf output
          ./gradlew clean buildPlugin \
            -PBuildConfiguration=Release \
            -PPluginVersion="${{ steps.version.outputs.version }}" \
            --no-daemon --stacktrace

      - name: Check package output
        shell: bash
        run: |
          test -n "$(find output -maxdepth 1 -type f -name '*.zip' -print -quit)"
          ls -lh output/*.zip

      - name: Run Kotlin tests and plugin quality checks
        shell: bash
        run: |
          ./gradlew detekt :test verifyPluginStructure verifyPlugin \
            -PBuildConfiguration=Release \
            -PPluginVersion="${{ steps.version.outputs.version }}" \
            --no-daemon --stacktrace

      - name: Run Rider platform integration tests
        shell: bash
        run: |
          ./gradlew riderIdeTest \
            -PBuildConfiguration=Release \
            -PPluginVersion="${{ steps.version.outputs.version }}" \
            --no-daemon --stacktrace

      - name: Run backend tests
        if: ${{ !cancelled() }}
        env:
          VSTEST_CONNECTION_TIMEOUT: 300
        shell: bash
        run: |
          dotnet test \
            src/dotnet/ReSharperPlugin.InspectionCopyBackend.Tests/ReSharperPlugin.InspectionCopyBackend.Tests.csproj \
            --configuration Release --no-build --no-restore \
            --logger "console;verbosity=minimal"

      - name: Check C# formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          dotnet format ReSharperPlugin.InspectionCopyBackend.sln \
            --verify-no-changes --no-restore --severity warn

      - name: Upload workflow artifact
        if: ${{ !cancelled() && hashFiles('output/*.zip') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: rider-inspection-copy-${{ steps.version.outputs.version }}
          path: output/*.zip
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" output/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" output/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes
          fi

      - name: Publish to JetBrains Marketplace
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PUBLISH_TOKEN" ]]; then
            echo "GitHub Actions secret PUBLISH_TOKEN is required to publish to JetBrains Marketplace." >&2
            exit 1
          fi

          ./gradlew publishPlugin \
            -PBuildConfiguration=Release \
            -PPluginVersion="${{ steps.version.outputs.version }}" \
            -PPublishToken="$PUBLISH_TOKEN" \
            --no-daemon --stacktrace
